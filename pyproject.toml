[project]
name = "online-cinema-project"
version = "0.1.0"
description = "A FastAPI project that allows users to select, watch, and purchase access to movies as well as manage their accounts."
authors = [
    {name = "Olha",email = "olgazinevych@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib (>=5.1.0,<6.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "alembic (>=1.18.3,<2.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "celery (>=5.6.2,<6.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "pydantic[email] (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "fastapi (>=0.128.5,<0.129.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "redis (>=7.1.0,<8.0.0)",
    "sqlalchemy (>=2.0.46,<3.0.0)",
    "stripe (>=14.3.0,<15.0.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "asyncpg (>=0.31.0,<0.32.0)"
]

[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
